# Budget lines (4-digit chart of accounts, effective 2026-06-01).
#
# Single source for:
#   - docs/zoho-expense/budget-categories.md (tables and search box)
#   - assets/data/budget_lines.json, which the zoho-receipt-to-report Claude skill fetches
#
# Every active 6000/7000 Zoho Expense category is listed here, so this file can be diffed
# against Zoho's live category list. When the chart of accounts changes in Zoho, update this
# file in the same week.
#
# Fields:
#   code, name         -- exactly as Zoho shows them ("6540 - Office Supplies")
#   zoho_category_id   -- Zoho Expense category_id (org 903421237); used by the skill only
#   budget_category    -- one of the `categories` below; goes in the report title
#   formerly           -- FY2026-27 budget code before the renumbering ("" if new)
#   finance_only       -- true for payroll postings, rollups and accounting entries that
#                         staff and executives should not pick
#   usage              -- when to use the line
#   keywords           -- extra search terms (lowercase)
#   examples           -- real reports: text (no names or health details), report_number,
#                         report_id (opens in Zoho for approvers only)

categories:
  - name: Compensation & Staff Support
    summary: Wages, benefits, honoraria, staff development and appreciation.
  - name: Professional & Contracted Services
    summary: Outside professionals and contracted services.
  - name: Operations, Facilities & IT
    summary: Running the building and the office, software, marketing and bank fees.
  - name: Governance & Meetings
    summary: Elections, retreats, and executive, Council, committee and AGM meetings.
  - name: Travel & Conferences
    summary: Travel, conferences and lobbying dues.
  - name: Programs, Grants & Student Support
    summary: Programs, events, orientation, grants, GSFA, affiliates and CPIF projects.
  - name: Other / Residual
    summary: Last-resort and accounting lines.

